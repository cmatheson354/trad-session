version: "3.9"

services:
  trad-session:
    build: .
    restart: unless-stopped
    ports:
      - "18010:18010"
    environment:
      - PORT=18010
      - DATA_DIR=/data
      # Uncomment to enable HTTPS (required for mic features):
      # - TLS_CERT=/certs/cert.pem
      # - TLS_KEY=/certs/key.pem
    volumes:
      - trad-data:/data
      # Uncomment and mount your certs for HTTPS:
      # - ./certs:/certs:ro

volumes:
  trad-data:
