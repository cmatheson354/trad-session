version: "3.9"

services:
  trad-session:
    build: .
    restart: unless-stopped
    ports:
      - "18011:18011"
    environment:
      - PORT=18011
      - DATA_DIR=/data
      - SSL_CERT=/certs/trad.crt
      - SSL_KEY=/certs/trad.key
    volumes:
      - trad-data:/data
      - ./certs:/certs:ro

volumes:
  trad-data:
